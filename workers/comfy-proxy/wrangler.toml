name = "gpuvietnam-comfy-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

kv_namespaces = [
  { binding = "COMFY_ACCESS", id = "bfce2066889e46f894c51bd2b9716359" }
]

routes = [
  { pattern = "work.gpuvietnam.com/*", zone_name = "gpuvietnam.com" }
]

# A1 M1: vendored comfyui-frontend-package (run scripts/vendor-comfy-frontend.mjs)
[assets]
directory = "./public"
binding = "ASSETS"
# Worker handles /api + auth first; ASSETS used via env.ASSETS.fetch for static.
run_worker_first = true

[vars]
COOKIE_NAME = "gvn_comfy"
# Next.js public host that serves /api/internal/comfy-proxy-resolve.
ORIGIN_RESOLVE_URL = "https://gpuvietnam.com/api/internal/comfy-proxy-resolve"
# Vast IP upstream hop (CF Workers cannot fetch literal IPs → error 1003).
# Clore hostnames unchanged. Set "off" to disable.
COMFY_IP_LITERAL_HOP_SUFFIX = "sslip.io"
# Optional fallback if ASSETS empty: https://…/comfy-workspace
# FE_STATIC_ORIGIN = ""
